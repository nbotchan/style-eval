[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "style-eval"
version = "0.0.1"
description = "Open-source evaluation toolkit for measuring how language models write and converse."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["faststylometry>=1.0.5", "numpy>=2.3.1"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
style-eval = "style_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
